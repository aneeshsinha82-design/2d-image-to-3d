<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free 2D → 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#f5f7fa;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(1050px,94vw);margin:40px 0;padding:34px;background:#11151d;border:1px solid #29303b;border-radius:24px;box-shadow:0 20px 70px #0008}h1{font-size:44px;margin:0 0 8px}.sub{color:#9ba5b4;margin:0 0 28px}.drop{border:2px dashed #3d4654;border-radius:18px;padding:40px 20px;text-align:center;cursor:pointer;background:#0b0e14}.drop.drag{border-color:#fff;background:#151a22}.drop strong{display:block;font-size:20px;margin-bottom:8px}.drop span{color:#8f99a8}input{display:none}.preview{display:none;max-width:100%;max-height:330px;margin:22px auto;border-radius:14px}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;margin:22px 0}button{border:0;border-radius:11px;padding:14px 24px;font-weight:700;font-size:16px;cursor:pointer;background:#fff;color:#111}button:disabled{opacity:.45;cursor:not-allowed}.status{padding:14px;border-radius:10px;background:#0a0d12;color:#c5ccd7;text-align:center}.bar{height:8px;background:#272d37;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#fff;transition:.4s}.viewer{display:none;margin-top:24px;border:1px solid #2b3340;border-radius:16px;overflow:hidden;background:#080a0f}.viewer model-viewer{width:100%;height:500px}.downloads{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.downloads a{padding:12px 17px;border:1px solid #414a58;border-radius:10px;color:#fff;text-decoration:none}.note{font-size:12px;color:#7f8997;text-align:center;margin-top:24px}
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head><body><main class="app"><h1>2D Image → 3D</h1><p class="sub">Free open-source AI generation using TripoSR.</p>
<label class="drop" id="drop"><strong>Upload a 2D image</strong><span>PNG, JPG or WebP • or drag and drop here</span><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label>
<img id="preview" class="preview">
<div class="controls"><button id="generate" disabled>Generate 3D Model</button></div>
<div class="status" id="status">Upload an image to begin.</div><div class="bar"><div id="fill" class="fill"></div></div>
<div class="viewer" id="viewer"><model-viewer id="model" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer></div>
<div class="downloads" id="downloads"><a id="glb" download="model.glb">Download GLB</a></div>
<p class="note">No Meshy API key. No payment required from this website. Generation uses the public Hugging Face TripoSR Space; free compute may have queues or availability limits.</p>
<script type="module">
import {Client,handle_file} from 'https://cdn.jsdelivr.net/npm/@gradio/client@1.4.2/+esm';
const file=document.getElementById('file'),drop=document.getElementById('drop'),preview=document.getElementById('preview'),generate=document.getElementById('generate'),status=document.getElementById('status'),fill=document.getElementById('fill'),viewer=document.getElementById('viewer'),model=document.getElementById('model'),downloads=document.getElementById('downloads'),glb=document.getElementById('glb');let selected=null;
function setStatus(t,p){status.textContent=t;fill.style.width=p+'%'}
function choose(f){if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){setStatus('Please select PNG, JPG or WebP.',0);return}selected=f;preview.src=URL.createObjectURL(f);preview.style.display='block';generate.disabled=false;setStatus('Image ready. Click Generate 3D Model.',0)}
file.onchange=e=>choose(e.target.files[0]);drop.onclick=e=>{if(e.target===drop||e.target.closest('strong,span'))file.click()};drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');choose(e.dataTransfer.files[0])};
generate.onclick=async()=>{if(!selected)return;generate.disabled=true;viewer.style.display='none';downloads.style.display='none';setStatus('Connecting to free 3D model…',8);
try{
const client=await Client.connect('stabilityai/TripoSR');
setStatus('Preparing image…',18);
const pre=await client.predict('/preprocess',{input_image:await handle_file(selected),do_remove_background:true,foreground_ratio:0.85});
setStatus('Generating 3D model… This can take several minutes on free compute.',35);
const result=await client.predict('/generate',{image:pre.data[0],mc_resolution:256});
setStatus('3D model generated!',100);
const glbData=result.data[1];
const url=typeof glbData==='string'?glbData:(glbData?.url||glbData?.path);
if(!url)throw new Error('The model was generated but no GLB file was returned.');
model.src=url;viewer.style.display='block';glb.href=url;downloads.style.display='flex';
}catch(e){console.error(e);setStatus('Generation error: '+(e?.message||e),0)}finally{generate.disabled=!selected}}
</script></main></body></html>
