<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2D Image → 3D</title><style>
body{margin:0;background:#080a0f;color:#fff;font:16px Arial;min-height:100vh;display:grid;place-items:center}.app{width:min(900px,92vw);background:#121620;border:1px solid #2b3240;border-radius:22px;padding:30px;text-align:center}h1{font-size:46px;margin:0 0 10px}.muted{color:#9da6b5}.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0}button,label{padding:14px 20px;border-radius:11px;border:1px solid #414957;background:#fff;color:#111;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input[type=file]{display:none}input[type=password]{width:min(500px,90%);padding:13px;border-radius:10px;border:1px solid #3b4351;background:#0b0e14;color:#fff}img{max-width:100%;max-height:360px;border-radius:14px;margin:15px auto;display:none}.status{margin:18px 0;padding:14px;background:#0b0e14;border-radius:10px}.bar{height:7px;background:#2a303b;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:.3s}.downloads{display:none;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.downloads a{color:#fff;border:1px solid #454d5c;border-radius:9px;padding:11px 15px;text-decoration:none}
</style></head><body><main class="app"><h1>2D Image → 3D</h1><p class="muted">Upload an image, then generate a downloadable 3D model.</p>
<div class="row"><label>Choose Image<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label></div><img id="preview"><p id="name" class="muted">No image selected</p>
<div><input id="key" type="password" placeholder="Paste your Meshy API key"></div>
<div class="row"><button id="go" disabled>Generate 3D Model</button></div>
<div id="status" class="status">Choose an image and enter your API key.</div><div class="bar"><div id="fill" class="fill"></div></div>
<div id="downloads" class="downloads"><a id="glb" target="_blank">Download GLB</a><a id="fbx" target="_blank">Download FBX</a><a id="obj" target="_blank">Download OBJ</a></div>
<p class="muted" style="font-size:12px;margin-top:24px">Your API key is entered locally in this browser. GitHub Pages does not store it.</p></main>
<script>
const $=id=>document.getElementById(id),file=$('file'),key=$('key'),go=$('go'),preview=$('preview'),status=$('status'),fill=$('fill');let image='';
file.onchange=()=>{const f=file.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){status.textContent='Please choose PNG, JPG or WebP.';return}const r=new FileReader();r.onload=()=>{image=r.result;preview.src=image;preview.style.display='block';$('name').textContent=f.name;status.textContent='Image ready. Click Generate 3D Model.';go.disabled=!key.value.trim()};r.readAsDataURL(f)};
key.oninput=()=>go.disabled=!(image&&key.value.trim());
async function request(url,opts={}){const res=await fetch(url,{...opts,headers:{Authorization:'Bearer '+key.value.trim(),'Content-Type':'application/json'}});const t=await res.text();let d;try{d=JSON.parse(t)}catch{throw Error('The 3D service returned an invalid response.')}if(!res.ok)throw Error(d.message||d.error?.message||('Request failed ('+res.status+')'));return d}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
go.onclick=async()=>{go.disabled=true;fill.style.width='5%';status.textContent='Uploading image and starting 3D generation…';
try{const create=await request('https://api.meshy.ai/openapi/v1/image-to-3d',{method:'POST',body:JSON.stringify({image_url:image,ai_model:'meshy-7.1',geometry_resolution:'2k',should_texture:true,enable_pbr:true,pose_mode:'a-pose',target_formats:['glb','fbx','obj']})});const id=create.result;if(!id)throw Error('No task ID was returned.');
let task=null;for(let i=0;i<180;i++){await wait(5000);task=await request('https://api.meshy.ai/openapi/v1/image-to-3d/'+encodeURIComponent(id));const p=Number(task.progress||0);fill.style.width=Math.max(5,Math.min(99,p))+'%';status.textContent='Generating 3D model… '+p+'%';if(task.status==='SUCCEEDED'||task.status==='FAILED')break}
if(!task||task.status!=='SUCCEEDED')throw Error(task?.task_error?.message||'Generation failed.');
fill.style.width='100%';status.textContent='3D model ready!';const u=task.model_urls||{};[['glb',u.glb],['fbx',u.fbx],['obj',u.obj]].forEach(([n,v])=>{const a=$(n);if(v){a.href=v;a.style.display='inline-block'}else a.style.display='none'});$('downloads').style.display='flex';
}catch(e){status.textContent='Error: '+e.message;fill.style.width='0%'}finally{go.disabled=!(image&&key.value.trim())}};
</script></body></html>
